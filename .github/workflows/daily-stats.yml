name: Daily Site Stats

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  send-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send daily stats email
        env:
          GC_CODE:    ${{ secrets.GOATCOUNTER_CODE }}
          GC_TOKEN:   ${{ secrets.GOATCOUNTER_TOKEN }}
          GMAIL_PASS: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 scripts/daily_stats.py
