<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peter Lee | Portfolio</title>
    <script type="module" crossorigin src="/assets/index-726e5d71.js"></script>
    <link rel="stylesheet" href="/assets/index-556ec970.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- PLRez AI — unified nav menu. Edit MENUS below to add/remove sections or items. -->
    <script>
      (function () {
        var MENUS = [
          {
            id: 'demos',
            icon: '\u{1F4C1}',
            label: 'Demos',
            items: [
              { href: '/demos/llm-resource.html',          icon: '\u{1F916}', label: 'LLM Resource' },
              { href: '/demos/support-ops-dashboard.html', icon: '\u{1F4CA}', label: 'Support Ops Dashboard' },
              { href: '/demos/workday-test-plan.html',     icon: '\u{1F680}', label: 'Workday Test Plan' },
              { href: '/demos/coming-soon.html',           icon: '\u{1F320}', label: 'Coming Soon' }
            ]
          },
          {
            id: 'projects',
            icon: '\u{1F4C2}',
            label: 'Projects',
            items: [
              { href: '/demos/job-seeker.html', icon: '\u{1F4BC}', label: 'Job Seeker' },
              { href: '#',                      icon: '\u{1F4FA}', label: 'YouTube' }
            ]
          }
        ];
        var CLOSE_DELAY_MS = 3000;

        function build() {
          if (document.getElementById('plrez-nav')) return;
          var nav = document.createElement('div');
          nav.id = 'plrez-nav';
          var sections = [];

          MENUS.forEach(function (menu) {
            var section = document.createElement('div');
            section.className = 'plrez-section';

            var trigger = document.createElement('div');
            trigger.className = 'plrez-trigger';
            trigger.innerHTML =
              '<span>' + menu.icon + '</span>' +
              '<span>' + menu.label + '</span>' +
              '<span class="plrez-chevron">›</span>';
            section.appendChild(trigger);

            var list = document.createElement('div');
            list.className = 'plrez-list';
            menu.items.forEach(function (item) {
              var a = document.createElement('a');
              a.className = 'plrez-item';
              a.href = item.href;
              a.innerHTML = '<span>' + item.icon + '</span><span>' + item.label + '</span>';
              list.appendChild(a);
            });
            section.appendChild(list);
            sections.push(section);
            nav.appendChild(section);
          });

          sections.forEach(function (section) {
            var timer = null;
            function open() {
              sections.forEach(function (s) { if (s !== section) s.classList.remove('open'); });
              if (timer) { clearTimeout(timer); timer = null; }
              section.classList.add('open');
            }
            function scheduleClose() {
              if (timer) clearTimeout(timer);
              timer = setTimeout(function () { section.classList.remove('open'); timer = null; }, CLOSE_DELAY_MS);
            }
            section.addEventListener('mouseenter', open);
            section.addEventListener('mouseleave', scheduleClose);
            section.addEventListener('mousemove', function () { if (timer) { clearTimeout(timer); timer = null; } });
            section.addEventListener('focusin', open);
            section.addEventListener('focusout', scheduleClose);
          });

          document.body.appendChild(nav);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', build);
        } else {
          build();
        }
      })();
    </script>
  </body>
</html>
