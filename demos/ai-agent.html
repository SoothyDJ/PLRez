<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; color: transparent; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
<style>
  #plrez-back-btn{position:fixed;top:1rem;left:1rem;z-index:9999;display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1rem .5rem .9rem;background:#915eff;color:#fff !important;text-decoration:none !important;border-radius:9999px;font-family:Poppins,system-ui,-apple-system,Segoe UI,sans-serif;font-weight:700;font-size:13px;box-shadow:0 8px 24px -4px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);transition:transform .15s ease,background .15s ease,color .15s ease;letter-spacing:.02em}
  #plrez-back-btn:hover{background:#fff;color:#915eff !important;transform:translateX(-2px)}
</style>
<a href="/" id="plrez-back-btn">← Back to Portfolio</a>

<div class="max-w-2xl w-full text-center">
    <div class="glass-panel p-16 rounded-2xl">
        <div class="w-24 h-24 bg-gradient-to-br from-indigo-500 to-purple-500 rounded-full flex items-center justify-center mx-auto mb-8">
            <span class="text-5xl">🧠</span>
        </div>

        <h1 class="text-4xl md:text-5xl font-bold mb-4">
            <span class="gradient-text">AI Agent</span>
        </h1>

        <p class="text-slate-400 text-lg mb-2">
            A working example is in the works.
        </p>

        <p class="text-slate-500 text-base">
            Check back soon for a live demo.
        </p>
    </div>
</div>

</body>
</html>
